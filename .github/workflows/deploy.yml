name: Build and deploy BookmarkAI

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Let an active deployment finish before starting another.
concurrency:
  group: bookmarkai-production
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install, test, and build backend
        working-directory: backend
        run: |
          npm ci
          npm test --if-present
          npm run build

      - name: Install, test, and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test --if-present
          VITE_BACKEND_URL="/backend" npm run build

  deploy:
    name: Deploy to EC2
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/Bookmarkai
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            cd backend
            npm ci
            npm run build

            # Find PM2 or install it for the current user.
            PM2_BIN="$(command -v pm2 || true)"
            if [ -z "$PM2_BIN" ]; then
              npm install --global --prefix "$HOME/.local" pm2
              PM2_BIN="$HOME/.local/bin/pm2"
            fi

            # Restart the backend or start it for the first time.
            if "$PM2_BIN" describe bookmarkai > /dev/null 2>&1; then
              "$PM2_BIN" restart bookmarkai --update-env
            else
              "$PM2_BIN" start dist/index.js --name bookmarkai --time
            fi

            "$PM2_BIN" save

            # Build the frontend with API requests routed through Nginx.
            cd ../frontend
            npm ci
            VITE_BACKEND_URL="/backend" npm run build

            # Publish the frontend files to the directory Nginx serves.
            sudo -n mkdir -p /var/www/bookmarkai
            sudo -n cp -r dist/. /var/www/bookmarkai/
            sudo -n chmod -R a+rX /var/www/bookmarkai