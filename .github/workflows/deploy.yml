name: Build and deploy BookmarkAI

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Never run two deployments against the same EC2 checkout at once.
concurrency:
  group: bookmarkai-production
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install, test, and build backend
        working-directory: backend
        run: |
          npm ci
          npm test --if-present
          npm run build

      - name: Install, test, and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test --if-present
          VITE_BACKEND_URL="http://${{ secrets.EC2_HOST }}:3000" npm run build

  deploy:
    name: Deploy to EC2
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/Bookmarkai
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            cd backend
            npm ci
            npm run build

            # PM2 is a server-level tool and may not be installed on a new EC2 host.
            # Install it in the SSH user's npm prefix so sudo/root is not required.
            PM2_BIN="$(command -v pm2 || true)"
            if [ -z "$PM2_BIN" ]; then
              npm install --global --prefix "$HOME/.local" pm2
              PM2_BIN="$HOME/.local/bin/pm2"
            fi

            if "$PM2_BIN" describe bookmarkai > /dev/null 2>&1; then
              "$PM2_BIN" restart bookmarkai --update-env
            else
              "$PM2_BIN" start dist/index.js --name bookmarkai --time
            fi
            "$PM2_BIN" save

            cd ../frontend
            npm ci
            VITE_BACKEND_URL="http://${{ secrets.EC2_HOST }}:3000" npm run build
